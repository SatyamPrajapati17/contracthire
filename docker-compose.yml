services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contractlens-db
    environment:
      POSTGRES_USER: contractlens
      POSTGRES_PASSWORD: contractlens
      POSTGRES_DB: contractlens
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractlens -d contractlens"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
